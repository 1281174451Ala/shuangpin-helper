[package]
name = "shuangpin-helper"
version = "0.1.0"
description = "A desktop visual keyboard for learning double pinyin"
authors = ["ShuangPin Helper contributors"]
edition = "2021"

[lib]
name = "shuangpin_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "wry"] }
macos-accessibility-client = "0.0.2"
# rdev 0.5.3 在 macOS 26 上会因非主线程调用 TSMGetInputSourceProperty 而崩溃，
# 官方 PR #147 已修复但 crates.io 尚未发版，因此固定到已验证修复的 git rev
# （Hush 项目实测 c14f2dc 通过，PR #147 的完整修复包含在此 commit 中）。
rdev = { git = "https://github.com/Narsil/rdev", rev = "c14f2dc5c8100a96c5d7e3013de59d6aa0b9eae2" }
serde = { version = "1", features = ["derive"] }
