<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Carve a small D counter into the top-right of the P (Gamma) key -->
    <mask id="tcut">
      <rect x="0" y="0" width="256" height="256" fill="white"/>
      <path d="M 150,58 L 174,58 A 24,24 0 0 1 174,106 L 150,106 Z" fill="black"/>
    </mask>
  </defs>
  <!-- Simplified main icon: 2x2 keys -> P (Gamma key) + in (bottom-right) -->
  <g mask="url(#tcut)">
    <rect x="43" y="43" width="170" height="78" rx="14" fill="#FFFFFF"/>
    <rect x="43" y="43" width="78" height="170" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="135" y="135" width="78" height="78" rx="14" fill="#FFFFFF"/>
</svg>
