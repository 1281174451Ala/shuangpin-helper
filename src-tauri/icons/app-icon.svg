<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="262" y1="262" x2="762" y2="762">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <!-- Carve a D-shaped counter into the top-right of the P key -->
    <mask id="pcut">
      <rect x="0" y="0" width="1024" height="1024" fill="white"/>
      <path d="M 540,302 L 660,302 A 75,75 0 0 1 660,452 L 540,452 Z" fill="black"/>
    </mask>
  </defs>

  <!-- App background (rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- Subtle top highlight for depth -->
  <ellipse cx="512" cy="170" rx="430" ry="250" fill="#ffffff" opacity="0.14"/>

  <!-- 2x2 key grid: P = top bar (A+B) + left stem (A+C) with a D counter carved in (B); in = bottom-right (D) -->
  <!-- shadows -->
  <rect x="262" y="276" width="500" height="230" rx="36" fill="#0F172A" opacity="0.18"/>
  <rect x="262" y="276" width="230" height="500" rx="36" fill="#0F172A" opacity="0.18"/>
  <rect x="532" y="546" width="230" height="230" rx="36" fill="#0F172A" opacity="0.18"/>

  <!-- P key (Gamma / flipped-Enter shape) with D counter -->
  <g mask="url(#pcut)">
    <rect x="262" y="262" width="500" height="230" rx="36" fill="url(#accent)"/>
    <rect x="262" y="262" width="230" height="500" rx="36" fill="url(#accent)"/>
  </g>

  <!-- in key (bottom-right cell) -->
  <rect x="532" y="532" width="230" height="230" rx="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="5"/>

  <!-- Letters: only the white key carries "in" -->
  <text x="647" y="647" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700"
        font-size="150" fill="#1E293B" text-anchor="middle" dominant-baseline="central">in</text>
</svg>
