name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & Release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 从 tag 名提取版本号并同步到配置文件
      - name: Sync version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json

      # Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      # Rust
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # 前端依赖
      - run: npm ci

      # 双保险：Release 工作流也跑一遍测试
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # 自动生成 Release Notes
      - name: Generate release notes
        id: notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag -l --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -1)

          {
            echo "## 更新内容"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "<details><summary>自 ${PREV_TAG} 以来的变更</summary>"
              echo ""
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)"
              echo ""
              echo "</details>"
            else
              echo "- 首个版本发布"
            fi
          } > release-notes.md

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release-notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 构建并发布
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "双拼辅助键盘 v${{ steps.version.outputs.version }}"
          releaseBody: |
            ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
